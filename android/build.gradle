buildscript {
    repositories {
        google()
        mavenCentral()
    }
}

def safeExtGet = { prop, fallback ->
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

apply plugin: "com.android.library"

def androidGradlePluginMajor = 0
try {
    def version = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION
    androidGradlePluginMajor = version.split("\\.")[0].toInteger()
} catch (Throwable ignored) {
}

def kotlinAlreadyApplied = plugins.hasPlugin("kotlin-android") ||
    plugins.hasPlugin("org.jetbrains.kotlin.android") ||
    plugins.hasPlugin("com.android.built-in-kotlin")

def builtInKotlin = false
def builtInKotlinProp = project.findProperty("android.builtInKotlin")
if (builtInKotlinProp != null) {
    builtInKotlin = builtInKotlinProp.toString() != "false"
} else if (androidGradlePluginMajor >= 9) {
    // AGP 9 registers the Kotlin extension itself when built-in Kotlin is on.
    builtInKotlin = true
}

if (!kotlinAlreadyApplied && !builtInKotlin) {
    apply plugin: "kotlin-android"
}

android {
    namespace "co.bitscorp.payblast.purchases"
    compileSdk safeExtGet("compileSdkVersion", 35)

    defaultConfig {
        minSdk safeExtGet("minSdkVersion", 24)
        targetSdk safeExtGet("targetSdkVersion", 35)
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

["kotlin-android", "org.jetbrains.kotlin.android", "com.android.built-in-kotlin"].each { pluginId ->
    pluginManager.withPlugin(pluginId) {
        try {
            android.kotlinOptions.jvmTarget = "17"
        } catch (Throwable ignored) {
        }
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation "com.facebook.react:react-native:+"
    // Play Billing Library 8 or newer is required for app updates.
    // https://developer.android.com/google/play/billing/integrate
    implementation "com.android.billingclient:billing-ktx:8.0.0"
}
